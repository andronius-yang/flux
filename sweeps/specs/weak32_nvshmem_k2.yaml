# 2026-09-01 32n baseline gather (user-directed, speedup-figure campaign):
# barebones blocking-put NVSHMEM ring (the 8/31 reference arm) at 32 nodes,
# full budget ladder, perf lane. Same binary as the 32n s1 ladder capsule
# 20260901-024555 (cross-capsule same-build comparison; sha recorded).
platform: perlmutter
nodes: 32
shape: k2
families:
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [1, 2, 4, 8, 16, 64]
variants:
  - l01_nvshmem
modes: [isolated]
iters: 10
warmup_iters: 5
skip_correctness: true
timeout_s: 240
idle_timeout_s: 180
retries: 0
notes: "32n baseline: l01_nvshmem ring K2 b1-b64 isolated, perf lane"
