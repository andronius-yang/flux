# 2026-09-03 (user-directed, ver4 figure): the main figure's "Ours" cell is
# the MIN over arms, and at 16n x 1 MiB that min is the direct-wire arm
# (placement + routing over a direct staged a2av). Capture it at 32n,
# 1 MiB only, with s1 + the ring in the SAME capsule (rule 4). dwire runs
# first so a walltime cut still keeps it. 5-min window.
platform: perlmutter
nodes: 32
shape: k2
families:
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [1]
variants:
  - ours_l01_s1_pv2_r2_dwire
  - ours_l01_s1_pv2_r2
  - l01_nvshmem
modes: [isolated]
iters: 10
warmup_iters: 5
skip_correctness: true
timeout_s: 120
idle_timeout_s: 90
retries: 0
notes: "32n 1 MiB: dwire vs s1 vs ring, one capsule (ver4 min-over-arms)"
