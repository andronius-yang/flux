# UltraEP M4: overlapped weight_sync (join point exposed) + one-sided nvshmem
# token transport, vs the moonep overlap trio, one build, one capsule.
#   moonep                   serialized port baseline
#   moonep_overlap           prefetch concurrent with dispatch (FINER than
#                            upstream — separate stream + communicator)
#   moonep_overlap_shared    AUTHENTIC upstream serialization (one comm path,
#                            prefetch after dispatch; window = scatter only)
#   moonep_nvshmem           one-sided token transport (putmem_nbi + barriers)
#   ultraep                  serialized port baseline
#   ultraep_overlap          join=dispatch — AUTHENTIC (the join is upstream's
#                            publication mechanism; window = pack only)
#   ultraep_overlap_joingemm join=gemm — COUNTERFACTUAL (window =
#                            pack+comm+scatter; sound only under two-sided
#                            NCCL port semantics, NR-12 fact 5)
#   ultraep_nvshmem          one-sided token transport, weight_sync NCCL
# ultraep_nvshmem_overlap deliberately excluded from this first capsule.
# Compare within this capsule only; overlap arms: never sum phase columns
# (prefetch_ms is off-chain; prefetch_wait_ms is the exposed stall).
platform: perlmutter
nodes: 4
variants:
  - moonep
  - moonep_overlap
  - moonep_overlap_shared
  - moonep_nvshmem
  - ultraep
  - ultraep_overlap
  - ultraep_overlap_joingemm
  - ultraep_nvshmem
families:
  - "trace:pools=mmlu/college_mathematics+mmlu/high_school_world_history+mmlu_ZH_CN/college_mathematics+mmlu_ZH_CN/high_school_world_history;layer=92;sem=pernode"
budgets_mib: [8]
topk: 8
G: 128
H: 4096
chunk_bytes: 8192
ffn_hidden: 4096
dtype: bfloat16
iters: 10
warmup_iters: 5
profile_iters: 3
sm_margin: 8
modes: [isolated, e2e]
matrix_instance: "001"
skip_correctness: false
timeout_s: 1500
extra_env:
  CUDA_DEVICE_MAX_CONNECTIONS: "8"
notes: "ultraep M4: weight_sync overlap join=dispatch (authentic) vs join=gemm (counterfactual) + nvshmem one-sided token transport, vs moonep serialized/overlap/overlap_shared/nvshmem, layer-92 trace b8/k8, correctness on"
