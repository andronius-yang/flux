modes: [isolated]
iters: 10
warmup_iters: 5
skip_correctness: true
timeout_s: 600
idle_timeout_s: 240
retries: 0
variants:
  - ablation_l01_s2_swapall_rst_3d_dual3_str4_bal_p2p_r2_pv3c_eps025
  - ours_l01_s1_pv2_r2_pv3c_eps025
  - ours_l01_s1_pv2_r2_pv3c_eps025_rpr0
  - ablation_l01_s2_swapall_rst_3d_dual3_str4_p2p_r2_pv3c_eps025
notes: "rpr 8n b64: dual3 band (previously heap-capped) + s1 ON vs legacy + legacy dual3"
