# Per-round relay staging at 8n b64 (2026-09-24): the heap-cap case — the composed
# swap lane's staging did not fit beside the fused ops' capacity buffers on the 16 G
# heap (flux_shm.cc:117 on every dual3 arm, capsule 20260923-202517). With the relay
# staging at 2 x max round chunk instead of 7 rounds, the dual3 band arm should fit;
# s1 ON vs _rpr0 gives the 8n latency parity read. debug QOS (30 min).
