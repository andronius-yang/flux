  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [1, 2, 4, 8, 16, 32, 64]
modes: [isolated]
iters: 10
warmup_iters: 5
skip_correctness: true
timeout_s: 2400
idle_timeout_s: 900
retries: 1
extra_env:
  FLUX_RS_BLOCKS: "20"
  FLUX_RS_WIRE_STREAMS: "7"
notes: "l1opt 8.23: K2 8n b1-b64 isolated, COMET winner v2 = n_split_l1=1 + RS_WIRE_STREAMS=7 + RS_BLOCKS=20 (production-wave + round aggregation), s1 canon basis (explicit k2 fields)"
