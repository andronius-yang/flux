# 2026-08-23 l1opt8n COMET winner spec v2: n_split_l1=1 + FLUX_RS_WIRE_STREAMS=7.
# NO `shape:` key ON PURPOSE (the k2 preset pins n_split_l1=7; fields below are
# VERBATIM SHAPE_PRESETS["k2"]). WHY ns1 on the DENSE path: the dense floor is
# the ep_topk_gather_rs production kernel's per-(node,split) tile-barrier waves
# (8n nsys: 8.1 ms/iter at b1, 12.5 at b8) plus n_split proxy rounds; ns1 cuts
# waves nnodes*n_split -> nnodes AND puts n_split*(NN-1) -> NN-1 (16n sibling:
# dense l1 47.0 -> 18.35, -61%). S=7 drains the single round over NN-1 lanes.
# Gate: batch10 comet-ns1 random-payload gates.
