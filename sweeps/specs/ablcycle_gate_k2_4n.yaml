# 2026-09-02 cycling-ablation GATE: K2 4n b64, correctness ON (runner exports
# FLUX_RANDOM_PAYLOAD=1 — rule-6 wire probe), professional_law eval on the
# mix8 basis. Gates the never-run pr0 arm (OURS driver, slipstream comm OFF)
# and the new reset-period / t1-noov arms against the s1 reference.
platform: perlmutter
nodes: 4
shape: k2
families:
  - "trace:model=Kimi-K2;pools=mmlu/professional_law;layer=5;sem=homog;dslots=64:32;opool=livecodebench/execution+mmlu/clinical_knowledge+mmlu/college_mathematics+mmlu/electrical_engineering+mmlu/high_school_psychology+mmlu/high_school_world_history+mmlu/philosophy+mmlu/professional_law"
budgets_mib: [64]
modes: [isolated]
iters: 16
warmup_iters: 5
timeout_s: 2400
idle_timeout_s: 900
retries: 1
extra_env:
  FLUX_A2AV_RS_SPIN_LIMIT: "20000000"
variants:
  - ablation_l01_pr0_pv2_r2
  - ours_l01_s1_pv2_r2
  - ablation_l01_s2_swapall_rp4_p2p_r2
  - ablation_l01_s2_swap_t1_rst_noov_p2p_r2
  - ablation_l01_s2_swap_t1_rp4_p2p_r2
notes: "ablcycle gate 9.2: K2 4n b64 correctness ON, pr0 + reset-period + t1-noov arms vs s1 reference"
