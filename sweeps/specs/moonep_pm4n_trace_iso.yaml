# MoonEP-semantics layer0 arm vs existing baselines on Perlmutter 4n16r,
# real Qwen3-235B decode trace routing (b8/k8, G=128) — the first capsule of
# the MoonEP port. moonep phase metrics (plan_comm/pack/comm/scatter/
# prefetch/gemm) land in metrics.csv in every mode; quote isolated-mode
# max-across-ranks per SCHEMA.md. The moonep arm's constant per-rank GEMM
# rows (S*K + padding) vs the baselines' skewed gemm_rows_per_rank is the
# balance fingerprint of the algorithm working.
platform: perlmutter
nodes: 4
variants:
  - moonep
  - allgather
  - hier_compress_lb_union
families:
  - "trace:pools=mmlu/college_mathematics+mmlu/high_school_world_history+mmlu_ZH_CN/college_mathematics+mmlu_ZH_CN/high_school_world_history;layer=92;sem=pernode"
budgets_mib: [8]
topk: 8
G: 128
H: 4096
chunk_bytes: 8192
ffn_hidden: 4096
dtype: bfloat16
iters: 10
warmup_iters: 5
profile_iters: 3
sm_margin: 8
modes: [isolated, e2e]
matrix_instance: "001"
skip_correctness: false
timeout_s: 900
notes: "MoonEP-semantics port M2 bring-up capsule: moonep vs allgather vs lb_union on real trace routing, isolated + e2e, correctness on"
