# 2026-09-15 (branch pv3): pv3c (C = 1/4) gates on the two remaining
# main-perf "Ours" lanes that share the ours planner — direct wire
# (ours2_direct) and s2 forced P2P swaps (ours12_dispatch) — per-iteration
# output validation + correctness at 4n K2 b16.
platform: perlmutter
nodes: 4
shape: k2
families:
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [16]
variants:
  - ours_l01_s1_pv2_r2_dwire_pv3c_eps025_gate
  - ours_l01_s2_swap_force_p2p_r2_pv3c_eps025_gate
modes: [isolated]
iters: 6
warmup_iters: 2
skip_correctness: false
timeout_s: 900
idle_timeout_s: 300
retries: 0
notes: "pv3c C=1/4 gates: direct wire + s2 swap force p2p, 4n K2 b16"
