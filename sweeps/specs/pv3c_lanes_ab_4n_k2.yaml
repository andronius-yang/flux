# 2026-09-15 (branch pv3): LocCap vs pv3c (C = 1/4) on the direct-wire and
# s2-swap "Ours" lanes, 4n K2, main-perf budgets, one binary, isolated.
platform: perlmutter
nodes: 4
shape: k2
families:
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [1, 4, 16]
variants:
  - ours_l01_s1_pv2_r2_dwire
  - ours_l01_s1_pv2_r2_dwire_pv3c_eps025
  - ours_l01_s2_swap_force_p2p_r2
  - ours_l01_s2_swap_force_p2p_r2_pv3c_eps025
modes: [isolated]
iters: 10
warmup_iters: 5
skip_correctness: true
timeout_s: 600
idle_timeout_s: 240
retries: 1
notes: "pv3c C=1/4 vs loccap on dwire + s2 swap lanes, 4n K2 b1/b4/b16"
