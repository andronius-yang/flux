# Capsule C — conn ladder (fan-out elimination): {8, 32} clones of the
# base + locality arms. conn=64 is NOT a rung (CUDA silently clamps at 32
# — a 64 cell would record a lie). extra_env must NOT set conn (it would
# flatten the clones). Relay-identity arms never enable EARLY_LAUNCH;
# lbu arms pin it inside enable_hier_compress — single-axis by design.
# Fan-out corollary: the (conn8 - conn32) penalty should SHRINK on the
# locality arms (analog of eager +27.6% @conn8 -> +2% @conn32).
platform: perlmutter
nodes: 4
variants:
  - epic_hc_m1
  - epic_hc_m1_conn32
  - epic_hc_m1_na_lc25
  - epic_hc_m1_na_lc25_conn32
  - epic_hc_m1_na_lbu_lc25
  - epic_hc_m1_na_lbu_lc25_conn32
families:
  - "trace:pools=mmlu/college_mathematics+mmlu/high_school_world_history+mmlu_ZH_CN/college_mathematics+mmlu_ZH_CN/high_school_world_history;layer=92;sem=pernode"
budgets_mib: [8, 64]
topk: 8
G: 128
H: 4096
chunk_bytes: 8192
ffn_hidden: 4096
dtype: bfloat16
iters: 10
warmup_iters: 5
profile_iters: 3
sm_margin: 8
matrix_instance: "001"
timeout_s: 900
idle_timeout_s: 900
modes: [isolated]
skip_correctness: true
notes: "C conn ladder {8,32}: 12 cells iso; conn=64 excluded (driver clamps silently at 32)"
