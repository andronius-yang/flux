# Comm-only layer-axis campaign (2026-08-16), P3 layer0 capsule — LOW budget
# tier (correctness ON; the torch un-overlapped baseline rides every cell as
# impl=torch rows). Arms: stock flux dispatch (allgather) + the full 2^3
# factorial on the lb_union base (F=FUSED_STAGE2, N=FANOUT, E=EARLY_LAUNCH).
# fast runs in its own e2e capsule (commsweep4n_l0fast_*.yaml, same binary —
# cross-capsule comparison licensed by the fast e2e==isolated equivalence +
# matching build hash, SCHEMA.md).
# Verdict protocol: pair with commsweep4n_l0_blow_rev.yaml (reversed variant
# order); a knob effect is real only if the sign agrees in both orderings.
