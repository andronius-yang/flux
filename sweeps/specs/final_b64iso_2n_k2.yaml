# b64 isolation at 2n k2 (2026-09-24): the final main-perf capsules read the new defaults
# +1.3..+3.6 % above the _legacy twin at b64 on 2n/4n (below it at 8n/16n). Same-binary twins
# isolate which default carries it: minmove off (_mm0), legacy staging + P2P (_rpr0), legacy
# staging + getmem (_rpr0_nop2p), per-round + getmem (_rpr_nop2p), all off (_legacy). 2 reps.
platform: perlmutter
nodes: 2
shape: k2
families:
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [64]
modes: [isolated]
iters: 12
warmup_iters: 5
skip_correctness: true
timeout_s: 600
idle_timeout_s: 240
retries: 1
variants:
  - ours_l01_s1_pv2_r2_pv3c_eps025
  - ours_l01_s1_pv2_r2_pv3c_eps025_mm0
  - ours_l01_s1_pv2_r2_pv3c_eps025_rpr0
  - ours_l01_s1_pv2_r2_pv3c_eps025_rpr0_nop2p
  - ours_l01_s1_pv2_r2_pv3c_eps025_rpr_nop2p
  - ours_l01_s1_pv2_r2_pv3c_eps025_legacy
notes: "b64 isolation 2n k2: which default costs at low node counts"
