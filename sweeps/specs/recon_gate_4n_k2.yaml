# Paper reconciliation gates (2026-09-23): (1) swap band trigger on the dual3 /
# dual3+moved-last mechanism arms (pv3c C = 1/4 = trigger C), (2) minimal-move
# water-fill relay partition (FLUX_A2AV_LB_MINMOVE, default ON) vs its legacy
# equal-cut twin (_mm0) on the same binary. proLaw severe reset-every cell (every
# timed iteration = a drift event); --check_iters 1 validates every iteration's
# l1 output against the reference. Gate-first: no timed cell before green.
platform: perlmutter
nodes: 4
shape: k2
families:
  - "trace:model=Kimi-K2;pools=mmlu/professional_law;layer=5;sem=homog;dslots=64:32;opool=livecodebench/execution+mmlu/clinical_knowledge+mmlu/college_mathematics+mmlu/electrical_engineering"
budgets_mib: [64]
modes: [isolated]
iters: 6
warmup_iters: 3
skip_correctness: false
timeout_s: 900
idle_timeout_s: 240
retries: 0
variants:
  - ours_l01_s1_pv2_r2_pv3c_eps025_gate
  - ours_l01_s1_pv2_r2_pv3c_eps025_mm0_gate
  - ablation_l01_s2_swapall_rst_3d_dual3_str4_bal_p2p_r2_pv3c_eps025_gate
  - ablation_l01_s2_swapall_rst_3d_dual3_ml_str4_bal_p2p_r2_pv3c_eps025_gate
notes: "recon gate 9.23: minmove partition (on/off) + band-triggered dual3 / dual3_ml swaps, per-iteration output checks"
