# Main-perf small-budget check of today's reconciliations (2026-09-24): b1 / b4 / b16 were not
# covered by the reconciliation A/Bs. New defaults (minmove partition, per-round 2-slot relay
# staging, P2P pulls) vs the _legacy twin (all three pinned to the old behaviour) on the same
# binary, one capsule, isolated. 8n (debug QOS): main-perf lcb family, fused arm.
platform: perlmutter
nodes: 8
shape: k2
families:
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [1, 4, 16]
modes: [isolated]
iters: 10
warmup_iters: 5
skip_correctness: true
timeout_s: 600
idle_timeout_s: 240
retries: 1
variants:
  - ours_l01_s1_pv2_r2_pv3c_eps025
  - ours_l01_s1_pv2_r2_pv3c_eps025_legacy
notes: "small-budget check 8n: new defaults vs _legacy twin, b1/b4/b16"
