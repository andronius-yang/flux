# M4d validation grid: getmem weight prefetch (one-sided destination pull,
# the authentic MoonEP semantics — NR-12 fact 6) vs the NCCL batch_isend_irecv
# port artifact, on real trace routing, one binary. Key reads: prefetch_ms
# getmem vs nccl (serialized arms), prefetch_wait_ms on the overlap arms (the
# getmem overlap needs no second communicator), and the correctness gates
# (per-slot broadcast check validates the pull bit-exactly).
platform: perlmutter
nodes: 4
variants:
  - moonep
  - moonep_overlap
  - moonep_getmem
  - moonep_getmem_overlap
  - moonep_nvshmem_getmem
families:
  - "trace:pools=mmlu/college_mathematics+mmlu/high_school_world_history+mmlu_ZH_CN/college_mathematics+mmlu_ZH_CN/high_school_world_history;layer=92;sem=pernode"
budgets_mib: [8]
topk: 8
G: 128
H: 4096
chunk_bytes: 8192
ffn_hidden: 4096
dtype: bfloat16
iters: 10
warmup_iters: 5
profile_iters: 3
sm_margin: 8
modes: [isolated, e2e]
matrix_instance: "001"
skip_correctness: false
timeout_s: 900
notes: "MoonEP port M4d: getmem weight pull (WeightPrefetchGetmem, symmetric weight home) vs NCCL prefetch, serialized + overlap, plus fully one-sided nvshmem+getmem arm; real Qwen3 trace b8/k8, correctness on"
