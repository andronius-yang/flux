# 16n large-budget probe — does lb_union beat union at high N once the budget
# is large? (2026-08-15; follow-up to the BLOCKING_WIRE confound)
#
# Background. The ONLY 16-node lb-vs-union data in the capsule set
# (20260805-135758 topk4 G128, 20260805-142025 topk8 G192) ran with
# FLUX_A2AV_BLOCKING_WIRE=1 and conn=1 (key absent from env_json), and there lb
# WINS: -1.7% median over 10 cells. But blocking wire serializes the GEMM behind
# the wire and is documented measurement-only, and the realistic-trace campaign
# found the lb/union gap vanishes under it -- i.e. it suppresses exactly the
# mechanism that makes lb worse. Split by knob:
#
#   nonblock conn8:  2n +2.0 (47 cells) | 4n +2.8 (61) | 8n +4.2 (15)   <- lb WORSENS with N
#   BLOCK    conn1:  4n +6.3 (18)       | 8n +2.2 (18) | 16n -1.7 (10)  <- lb IMPROVES with N
#
# The N-trend reverses sign with the knob, and there is NO non-blocking 16n
# measurement anywhere. A1/A2 supply that. This probe attacks the other axis.
#
# Why budget. lb's penalty shrinks as budget grows (topk8 4n: +10.4 at b1 ->
# +2.3 at b8), and the 16n wins sit at the largest budgets tested (-1.4 at b8
# topk8, -2.2 at b32 topk4). If lb ever wins non-blocking, big budget at high N
# is where. b=64 has never run above 2 nodes and b=32/topk8 at 16n has ZERO ok
# cells in history (all exit 143, timeout-reaped), so cells here are expected to
# be able to fail -- hence a separate 8-cell capsule rather than extra rows in
# A1/A2, where a timeout would cost the primary result instead of one cell.
#
# conn=8 deliberately: the non-blocking N-series this extends is all conn=8, and
# neither arm allocates per-round streams, so channels are not the variable.
# timeout_s cut to 600 so a hung cell is reaped sooner. skip_correctness because
# the reference at b64/64-rank is itself a harness-memory risk.
platform: perlmutter
nodes: 16
variants:
  - hier_compress_union             # the arm to beat
  - hier_compress_lb_union          # does the balanced wire win at high N + big budget?
families:
  - "trace:pools=mmlu/high_school_world_history;layer=92;sem=homog"   # real routing
  - uniform                                                          # synthetic control
budgets_mib: [32, 64]
topk: 8
G: 192
H: 4096
chunk_bytes: 8192
ffn_hidden: 4096
dtype: bfloat16
iters: 10
warmup_iters: 5
profile_iters: 3
sm_margin: 8
modes: [isolated]
matrix_instance: "001"
skip_correctness: true
timeout_s: 600
extra_env:
  CUDA_DEVICE_MAX_CONNECTIONS: "8"
notes: "16n large-budget probe: union vs lb_union, trace+uniform, b32/b64 k8 G192, isolated, conn=8, NON-blocking wire"
