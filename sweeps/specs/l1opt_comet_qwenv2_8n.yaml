# 2026-08-23 l1opt8n COMET winner spec v2 (qwen twin of l1opt_comet_k2v2_8n.yaml
# — see that header; qwen3 preset does not pin n_split_l1, so shape key stays).
platform: perlmutter
nodes: 8
shape: qwen3
families:
  - "trace:model=Qwen3-235B;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [1, 2, 4, 8, 16, 32, 64]
modes: [isolated]
iters: 10
warmup_iters: 5
n_split_l1: 1
skip_correctness: true
timeout_s: 2400
idle_timeout_s: 900
retries: 1
extra_env:
  FLUX_RS_BLOCKS: "20"
  FLUX_RS_WIRE_STREAMS: "7"
notes: "l1opt 8.23: Qwen3 8n b1-b64 isolated, COMET winner v2 = n_split_l1=1 + RS_WIRE_STREAMS=7 + RS_BLOCKS=20, s1 canon basis"
