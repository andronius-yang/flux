# CASE-STUDY capture (2026-09-05, figs/case_study): the S-C dwell-4 topic
# schedule (handoff 34 §3, ablsched_sc_d4_k2_4n.yaml) profiled end-to-end
# under nsys so BOTH case studies come from one process / one binary / one
# placement lineage: efficient = a seen-topic block (livecodebench), skewed
# = the professional_law block (LOO basis). Second family = the plain lcb
# homog cell (main-figure pool, fresh oracle placement) as the alternative
# "most efficient" reference. Arms: the methodology s2 one-round overlapped
# swap, its sequential twin (overlap effect), the equal-split routing twin
# (local-routing effect). nsys mode = timelines + byte ledgers only, NEVER
# latency (SCHEMA protocol rule 3).
platform: perlmutter
nodes: 4
shape: k2
families:
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32;opool=livecodebench/execution+mmlu/clinical_knowledge+mmlu/college_mathematics+mmlu/electrical_engineering+mmlu/high_school_psychology+mmlu/high_school_world_history+mmlu/philosophy;sched=livecodebench/execution+mmlu/clinical_knowledge+mmlu/college_mathematics+mmlu/electrical_engineering+mmlu/high_school_psychology+mmlu/high_school_world_history+mmlu/philosophy+mmlu/professional_law;dwell=4"
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [64]
modes: [nsys]
iters: 32
warmup_iters: 5
profile_iters: 3
skip_correctness: true
timeout_s: 2400
idle_timeout_s: 900
retries: 1
extra_env:
  FLUX_OURS_NVTX: "1"
  FLUX_A2AV_NVTX_PROXY: "1"
  FLUX_A2AV_EARLY_LAUNCH: "1"
  FLUX_SWEEP_ISOLATED_ITERS: "1"
variants:
  - ours_l01_s2_swap_p2p_t1_r2
  - ablation_l01_s2_swap_t1_noov_p2p_r2
  - ablation_l01_s2_swap_t1_esplit_p2p_r2
notes: "case-study nsys 9.5: K2 4n b64 S-C dwell4 full-schedule profile (32+5 iters) + plain lcb homog; one-round OVL swap / noov twin / equal-split routing twin; host NVTX on"
