  - "trace:model=Kimi-K2;pools=mmlu/professional_law;layer=5;sem=homog;dslots=64:32"
budgets_mib: [1, 2, 4, 8, 16, 64]
modes: [isolated]
iters: 10
warmup_iters: 5
skip_correctness: true
timeout_s: 1200
idle_timeout_s: 600
retries: 1
notes: "hetmatch 9.1: K2 4n matched oracle (same-topic prev window), professional_law eval — ablation study 2 (no-drift control)"
