# 2026-09-01 ablation study 2: MATCHED conditions (no drift). Same eval
# topic as study 1 (professional_law homog [64,96)) but the oracle is the
# SAME topic's previous window [32,64) — no opool, the rule-10 canon
# basis. Under matched oracle the tau=1 swap orbit should fire ~no swaps;
# the expected gains come from comm+placement combination alone, and the
# study-1 inequality (COMET > singles > combined) should hold with
# ovl ~= seq. One rep, b64, 4n (user directive).
platform: perlmutter
nodes: 4
shape: k2
