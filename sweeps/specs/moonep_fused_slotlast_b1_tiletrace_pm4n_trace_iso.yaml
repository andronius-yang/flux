# Tile-trace mechanism capture for the b1 win-regime probe (see
# moonep_fused_slotlast_b1_pm4n_trace_iso.yaml): under tokens_first (weights
# late), does the interleaved arm show CTAs parked on the WEIGHT gate of
# slot-class tiles, and does tokfirst_slotlast relocate that spin into a
# harmless full-occupancy tail? Instrumented — never quote latency.
platform: perlmutter
nodes: 4
variants:
  - moonep_fused_push_auto_gated_tokfirst
  - moonep_fused_push_auto_gated_tokfirst_slotlast
families:
  - "trace:pools=mmlu/college_mathematics+mmlu/high_school_world_history+mmlu_ZH_CN/college_mathematics+mmlu_ZH_CN/high_school_world_history;layer=92;sem=pernode"
budgets_mib: [1]
topk: 8
G: 128
H: 4096
chunk_bytes: 8192
ffn_hidden: 4096
dtype: bfloat16
iters: 10
warmup_iters: 5
profile_iters: 3
sm_margin: 8
modes: [isolated]
matrix_instance: "001"
skip_correctness: false
timeout_s: 900
extra_env:
  FLUX_A2AV_NVTX_PROXY: "1"
notes: "NR-14 b1 mechanism: tile-trace A/B tokfirst vs tokfirst_slotlast, instrumented"
