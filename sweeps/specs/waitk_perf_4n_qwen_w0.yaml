# FLUX_A2AV_RS_WAIT_KERNEL=0 perf read, 4n Qwen main-perf budgets (same binary twin; run back-to-back with w1)
platform: perlmutter
nodes: 4
shape: qwen3
families:
  - "trace:model=Qwen3-235B;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [1, 4, 16, 64]
modes: [isolated]
iters: 10
warmup_iters: 5
skip_correctness: true
timeout_s: 500
idle_timeout_s: 200
retries: 0
variants:
  - ours_l01_s1_pv2_r2_pv3c_eps025
extra_env:
  FLUX_A2AV_RS_WAIT_KERNEL: "0"
notes: "waitk perf 4n qwen w0"
