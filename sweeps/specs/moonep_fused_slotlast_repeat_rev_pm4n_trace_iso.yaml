# NR-14 order-control (2026-08-15): IDENTICAL to
# moonep_fused_slotlast_repeat_pm4n_trace_iso.yaml except the two arms are
# listed in the REVERSED order. In every prior capsule the slow b64 cell was
# the FIRST cell of its budget group, which confounds arm with position.
#   - if the slow cell follows POSITION (slotinterleave now slow), the b64
#     "slot-last win" of 20260814-145605 is a run-order artifact and slot-last
#     has no measured benefit;
#   - if it follows the ARM (slotlast slow again, now running second), slot-last
#     is a real REGRESSION at b64 and NR-14's headline is sign-flipped.
# Either way the canonicalization decision rests on this pair of capsules.
platform: perlmutter
nodes: 4
variants:
  - moonep_fused_push_auto_gated_slotinterleave
  - moonep_fused_push_auto_gated_slotlast
families:
  - "trace:pools=mmlu/college_mathematics+mmlu/high_school_world_history+mmlu_ZH_CN/college_mathematics+mmlu_ZH_CN/high_school_world_history;layer=92;sem=pernode"
budgets_mib: [64]
topk: 8
G: 128
H: 4096
chunk_bytes: 8192
ffn_hidden: 4096
dtype: bfloat16
iters: 20
warmup_iters: 5
profile_iters: 3
sm_margin: 8
modes: [isolated, e2e]
matrix_instance: "001"
skip_correctness: true
timeout_s: 900
notes: "NR-14 order-control: same b64 probe with arm order REVERSED, to separate the slow-first-cell artifact from a real slot-last effect"
