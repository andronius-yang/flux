# noshard triage triple (b8, full length): nocache = allocator-UAF
# discriminator; direct = gateway-chain removal; dbg = sync suppression
# at full iteration count.
platform: perlmutter
nodes: 4
shape: k2
variants: [ours_l01_s2_stale_noshard_nocache, ours_l01_s2_stale_noshard_direct, ours_l01_s2_stale_noshard_dbg]
families:
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [8]
modes: [isolated]
iters: 10
warmup_iters: 5
skip_correctness: true
timeout_s: 1800
idle_timeout_s: 600
retries: 0
notes: "noshard triage: nocache/direct/dbg discriminators"
