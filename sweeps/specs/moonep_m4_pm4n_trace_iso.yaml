# M4 transport/overlap grid for the MoonEP-semantics arm on real trace
# routing: {nccl, nvshmem one-sided} x {serialized, overlapped prefetch}.
# Same plan and correctness gates on every arm — the grid isolates transport
# and overlap effects with semantics held fixed. Key reads: comm_ms nccl vs
# nvshmem (two-sided grouped P2P vs one-sided putmem_signal), and
# prefetch_wait_ms on the *_overlap arms (how much of the 4.7 ms serialized
# prefetch cost the MoonEP async_finish-style comm stream actually hides).
platform: perlmutter
nodes: 4
variants:
  - moonep
  - moonep_overlap
  - moonep_nvshmem
  - moonep_nvshmem_overlap
families:
  - "trace:pools=mmlu/college_mathematics+mmlu/high_school_world_history+mmlu_ZH_CN/college_mathematics+mmlu_ZH_CN/high_school_world_history;layer=92;sem=pernode"
budgets_mib: [8]
topk: 8
G: 128
H: 4096
chunk_bytes: 8192
ffn_hidden: 4096
dtype: bfloat16
iters: 10
warmup_iters: 5
profile_iters: 3
sm_margin: 8
modes: [isolated, e2e]
matrix_instance: "001"
skip_correctness: false
timeout_s: 900
notes: "MoonEP port M4: transport (nccl vs one-sided nvshmem All2AllSingle) x prefetch (serialized vs overlapped comm-stream) grid, real Qwen3 trace b8/k8, correctness on"
