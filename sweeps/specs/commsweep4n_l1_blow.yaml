# Comm-only layer-axis campaign, P3 LAYER1 capsule — low tier. First-ever
# layer1 sweep: flux arms auto-expand x2 over timing_mode (tmiso = index
# build in-forward; tmamo = layer0-inherited indices, the combined-pass
# proxy — never compare across timing_mode). torch un-overlapped baseline
# rides every cell as impl=torch rows (correctness ON). l1_fast runs in its
# own e2e capsule (commsweep4n_l1fast_*.yaml, same binary).
# l1_compress / l1_compress_eager / l1_hier_eager DROPPED 2026-08-16 (P2
# bring-up): compress hangs on its first forward at 2n (both tm, clean AND
# CHECK_IDENTITY; capsules 20260816-123413 / -125015), and hier_eager ALSO
# hangs at 2n — sm_margin 16 and 32 both still hang (rung 3c), refuting the
# persistent-kernel SM-deadlock hypothesis. Both are on the parallel debug
# track; do not re-add until they pass the 2n ladder. Until then the l1
# sweep story is torch (impl rows) / l1_dense / l1_hier / l1_fast.
platform: perlmutter
nodes: 4
variants:
  - l1_dense
  - l1_hier
families:
  - "trace:pools=mmlu/high_school_world_history;layer=92;sem=homog"
budgets_mib: [1, 2, 4, 8, 16]
topk: 8
G: 128
H: 4096
chunk_bytes: 8192
ffn_hidden: 4096
dtype: bfloat16
iters: 10
warmup_iters: 5
sm_margin: 8
modes: [isolated]
matrix_instance: "001"
skip_correctness: false
timeout_s: 900
notes: "comm-only campaign P3 l1 blow fwd: first layer1 sweep, real Qwen3 trace, W16"
