# Step-0 floor attribution (2026-08-29, low-budget diagnosis): nsys capture
# of the OURS canon arm (pv2 placement, r2 slack) + the COMET comparator at
# 4n K2, b1 (floor-dominated) + b8 (near-crossover). DIAGNOSTIC CAPSULE —
# instrumented (isolated-iteration discipline + early launch per the
# 2026-08-05 profiling defaults, FLUX_OURS_NVTX plan-lane sub-ranges),
# never quote latency from these cells. Goal: split plan_ms (route kernel /
# xchg allgather / vce tail / derive_routed_meta / combine meta / scale) and
# the l1 combine floor (GEMM1 tiles / pack / wire puts / bucket receiver)
# that the 22/23 record capsules only record as bracket totals.
platform: perlmutter
nodes: 4
shape: qwen3
families:
  - "trace:model=Qwen3-235B;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [1, 8]
modes: [nsys]
iters: 10
warmup_iters: 5
profile_iters: 3
skip_correctness: true
timeout_s: 2400
idle_timeout_s: 900
retries: 1
extra_env:
  FLUX_SWEEP_ISOLATED_ITERS: "1"
  FLUX_A2AV_EARLY_LAUNCH: "1"
  FLUX_A2AV_NVTX_PROXY: "1"
  FLUX_OURS_NVTX: "1"
notes: "step0 floor attribution 8.29: Qwen 4n b1/b8 nsys, ours_l01_s1_pv2_r2 + l01_allgather_dense (COMET), plan-lane NVTX sub-splits — diagnostic, never quote latency"
