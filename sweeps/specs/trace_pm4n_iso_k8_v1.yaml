# Realistic-trace campaign R1 — clean isolated latency, lb_union vs union on
# REAL Qwen3-235B routing (Patterns behind Chaos traces; 94-layer scan +
# offline predictor: layer 92 = max cross-topic divergence 0.726, per-rank
# GEMM rows 15.5k..61k (3.9x), predicted lb_union deficits up to 0.54; layer
# 60 = near-median divergence control). Arms:
#   uniform            — synthetic control
#   4x homog           — topic-homogeneous batches (receiver-side skew)
#   pernode            — per-node topic affinity, node i <- pools[i] (the
#                        realistic fanoutskew analogue; the starvation bet)
#   mixed              — all ranks sample the 4-pool mixture (control)
#   pernode dealer=1   — SAME bytes, synthetic max-dedup dealer (isolates the
#                        real token-overlap effect)
#   pernode layer=60   — median-divergence layer (not-cherry-picked check)
# EARLY_LAUNCH=1 campaign config; pairs only within this capsule.
platform: perlmutter
nodes: 4
variants:
  - hier_compress_lb_union
  - hier_compress_union
families:
  - "uniform"
  - "trace:pools=mmlu/college_mathematics;layer=92;sem=homog"
  - "trace:pools=mmlu/high_school_world_history;layer=92;sem=homog"
  - "trace:pools=mmlu_ZH_CN/college_mathematics;layer=92;sem=homog"
  - "trace:pools=mmlu_ZH_CN/high_school_world_history;layer=92;sem=homog"
  - "trace:pools=mmlu/college_mathematics+mmlu/high_school_world_history+mmlu_ZH_CN/college_mathematics+mmlu_ZH_CN/high_school_world_history;layer=92;sem=pernode"
  - "trace:pools=mmlu/college_mathematics+mmlu/high_school_world_history+mmlu_ZH_CN/college_mathematics+mmlu_ZH_CN/high_school_world_history;layer=92;sem=mixed"
  - "trace:pools=mmlu/college_mathematics+mmlu/high_school_world_history+mmlu_ZH_CN/college_mathematics+mmlu_ZH_CN/high_school_world_history;layer=92;sem=pernode;dealer=1"
  - "trace:pools=mmlu/college_mathematics+mmlu/high_school_world_history+mmlu_ZH_CN/college_mathematics+mmlu_ZH_CN/high_school_world_history;layer=60;sem=pernode"
budgets_mib: [8, 32]
topk: 8
G: 128
H: 4096
chunk_bytes: 8192
ffn_hidden: 4096
dtype: bfloat16
iters: 10
warmup_iters: 5
profile_iters: 3
sm_margin: 8
modes: [isolated]
matrix_instance: "001"
skip_correctness: false
timeout_s: 900
extra_env:
  FLUX_A2AV_EARLY_LAUNCH: "1"
notes: "realistic-trace campaign R1: clean isolated latency, lb_union vs union, Qwen3-235B 2x2 subject/lang pools (+pernode/mixed/dealer/median-layer arms), b8+b32 k8, EARLY_LAUNCH campaign config"
