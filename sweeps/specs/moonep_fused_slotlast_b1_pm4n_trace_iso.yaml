H: 4096
chunk_bytes: 8192
ffn_hidden: 4096
dtype: bfloat16
iters: 20
warmup_iters: 5
profile_iters: 3
sm_margin: 8
modes: [isolated, e2e]
matrix_instance: "001"
skip_correctness: false
