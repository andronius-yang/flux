# Narrative check 1 (2026-09-23): does the ablation keep its ordering under the
# band trigger? The matched study of figs/ablation (pv3c C=1/4 arms) with band twins
# at C=1/4 (= router) and C=1/16; it0 = the postwarmup drift-event iteration,
# rest_mean = iterations 1-9. Run 3x (3 reps).
