# 2026-09-17 dov device fan-out gate: per-iteration output checks +
# correctness + random payload (the wire audit for the device-issued
# quiet-then-signal fan-out), 4n K2 b1+b8, same shape as dov_gate_4n_k2.
platform: perlmutter
nodes: 4
shape: k2
variants: [ours_l01_s1_pv2_r2_dov_dev_gate]
families:
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [1, 8]
modes: [isolated]
iters: 4
warmup_iters: 2
skip_correctness: false
timeout_s: 2400
idle_timeout_s: 600
retries: 0
extra_env:
  FLUX_PLL_RANDOM_PAYLOAD: "1"
notes: "dov_dev gate 4n k2 b1+b8, correctness ON, random payload"
