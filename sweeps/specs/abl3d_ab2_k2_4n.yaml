# 3D scheduling (2026-09-09) latency A/B-2 on the RESET-EVERY base: the placement is
# restored to the oracle basis before every timed iteration, so every iteration carries
# the full 8-slot composed orbit (the 9/2 nsys proxy) — the nr base converges and moves
# ~nothing per iteration (A/B-1). Same binary, one capsule, isolated.
platform: perlmutter
nodes: 4
shape: k2
families:
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32;opool=livecodebench/execution+mmlu/clinical_knowledge+mmlu/college_mathematics+mmlu/electrical_engineering+mmlu/high_school_psychology+mmlu/high_school_world_history+mmlu/philosophy;sched=livecodebench/execution+mmlu/clinical_knowledge+mmlu/college_mathematics+mmlu/electrical_engineering+mmlu/high_school_psychology+mmlu/high_school_world_history+mmlu/philosophy+mmlu/professional_law;dwell=4"
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [64]
modes: [isolated]
iters: 32
warmup_iters: 5
skip_correctness: true
timeout_s: 2400
idle_timeout_s: 900
retries: 1
variants:
  - ablation_l01_s2_swapall_rst_3d_early_str4_p2p_r2
  - ablation_l01_s2_swapall_rst_3d_noov_str4_p2p_r2
  - ablation_l01_s2_swapall_rst_3d_late_str4_p2p_r2
  - ablation_l01_s2_swapall_rst_3d_dual_str4_p2p_r2
  - ablation_l01_s2_swapall_rst_3d_dual_p2p_r2
  - ablation_l01_s2_swapall_rst_3d_dual_ml_str4_p2p_r2
notes: "abl3d A/B-2 9.9: RESET-EVERY base (full 8-slot orbit every timed iteration), K2 4n b64 S-C d4 + plain lcb, isolated; early/noov/late/dual x streams, dual+l0-moved-last"
