# 3D scheduling (2026-09-08) latency A/B on the case-study families (S-C dwell-4
# schedule + plain lcb), K2 4n b64, ISOLATED (per-layer latency semantics). Same
# binary, one capsule: early (9/1 ablation issue point, host-gap overlap) / noov
# (sequential) / late (both matrices under l0) / dual (w1 under l0, w2 under l1)
# x {1,4} movement streams x l0 moved-last, plus the overlapped COMET baseline.
platform: perlmutter
nodes: 4
shape: k2
families:
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32;opool=livecodebench/execution+mmlu/clinical_knowledge+mmlu/college_mathematics+mmlu/electrical_engineering+mmlu/high_school_psychology+mmlu/high_school_world_history+mmlu/philosophy;sched=livecodebench/execution+mmlu/clinical_knowledge+mmlu/college_mathematics+mmlu/electrical_engineering+mmlu/high_school_psychology+mmlu/high_school_world_history+mmlu/philosophy+mmlu/professional_law;dwell=4"
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [64]
modes: [isolated]
iters: 32
warmup_iters: 5
skip_correctness: true
timeout_s: 2400
idle_timeout_s: 900
retries: 1
variants:
  - ablation_l01_s2_swapall_nr_3d_early_str4_p2p_r2
  - ablation_l01_s2_swapall_nr_3d_late_str4_p2p_r2
  - ablation_l01_s2_swapall_nr_3d_dual_str4_p2p_r2
  - ablation_l01_s2_swapall_nr_3d_dual_p2p_r2
notes: "abl3d A/B-2 9.9: K2 4n b64 S-C d4 + plain lcb, isolated; late/dual WITHOUT l0 moved-last x streams, early anchor (supplement to abl3d_ab)"
