# P3 layer1 capsule, high tier (skip_correctness: the layer1 torch reference
# materializes full gathered buffers and OOMs at large budgets — the new
# --skip_correctness flag exists exactly for this).
platform: perlmutter
nodes: 4
# compress + hier_eager arms dropped (2n hangs) — see commsweep4n_l1_blow.yaml
variants:
  - l1_dense
  - l1_hier
families:
  - "trace:pools=mmlu/high_school_world_history;layer=92;sem=homog"
budgets_mib: [32, 64]
topk: 8
G: 128
H: 4096
chunk_bytes: 8192
ffn_hidden: 4096
dtype: bfloat16
iters: 10
warmup_iters: 5
sm_margin: 8
modes: [isolated]
matrix_instance: "001"
skip_correctness: true
timeout_s: 900
notes: "comm-only campaign P3 l1 bhigh fwd: b32/b64, torch reference infeasible (skip)"
