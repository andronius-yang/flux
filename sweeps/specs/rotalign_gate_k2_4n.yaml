# Rotation-aligned static schedule (FLUX_A2AV_SCHED_ROT_ALIGN, 2026-09-11)
# correctness gate: main-perf OURS arm gate twin, knob off vs on, per-iteration
# output validation (--check_iters 1) under random payload. Gate-first: no
# timed cell before green.
platform: perlmutter
nodes: 4
shape: k2
families:
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [8, 64]
modes: [isolated]
iters: 6
warmup_iters: 2
skip_correctness: false
timeout_s: 1800
idle_timeout_s: 600
retries: 0
variants:
  - ours_l01_s1_gate_pv2_r2
  - ours_l01_s1_gate_pv2_r2_rotalign
notes: "rotalign gate 9.11: K2 4n b8/b64 lcb, gate twins knob off/on, check_iters=1"
