# WinCast default-flip validation: bare (no RS env) must equal the pinned
# canonical arm within noise; correctness at b8, perf at b8+b64.
platform: perlmutter
nodes: 4
shape: k2
variants:
  - l01_lbunion_compress
  - l01_wincast_bare
families:
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog"
budgets_mib: [8, 64]
dtype: bfloat16
modes: [isolated]
iters: 10
warmup_iters: 5
sm_margin: 8
matrix_instance: "001"
retries: 1
timeout_s: 2400
idle_timeout_s: 900
skip_correctness: false
extra_env:
  CUDA_DEVICE_MAX_CONNECTIONS: "8"
