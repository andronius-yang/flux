# Egress NIC-sharding debut grid: sharded vs unsharded push arms, join and
# tiles gates, one binary (post-sharding build). b1 = weight-dominated (the
# predicted win regime), b8 = contended. Rerun as the _rev twin (reversed
# variants order) before quoting any delta (NR-14 method rule).
platform: perlmutter
nodes: 4
variants: [moonep_fused_push_auto, moonep_fused_push_auto_shard, moonep_fused_push_auto_gated, moonep_fused_push_auto_gated_shard]
families: ["trace:pools=mmlu/college_mathematics+mmlu/high_school_world_history+mmlu_ZH_CN/college_mathematics+mmlu_ZH_CN/high_school_world_history;layer=92;sem=pernode"]
budgets_mib: [1, 8]
topk: 8
G: 128
H: 4096
chunk_bytes: 8192
ffn_hidden: 4096
iters: 10
warmup_iters: 5
profile_iters: 3
sm_margin: 8
modes: [isolated]
matrix_instance: "001"
skip_correctness: false
timeout_s: 900

notes: "NIC-shard debut conn=8: auto[/gated] x [shard/noshard], trace b1/8, isolated, correctness on"
