# Main-perf-conditions check of today's reconciliations at 16n (2026-09-24, SCHEMA rule 17):
# lcb family, fused Ours arm, b1/b4/b16 (b64 covered by 20260924-130341). New defaults vs
# the _legacy twin, one binary, one capsule, isolated. 30-min regular-QOS window.
platform: perlmutter
nodes: 16
shape: k2
families:
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [1, 4, 16]
modes: [isolated]
iters: 8
warmup_iters: 4
skip_correctness: true
timeout_s: 500
idle_timeout_s: 200
retries: 0
variants:
  - ours_l01_s1_pv2_r2_pv3c_eps025
  - ours_l01_s1_pv2_r2_pv3c_eps025_legacy
notes: "main-perf conditions 16n: new defaults vs _legacy twin, b1/b4/b16"
