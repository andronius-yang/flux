# Clean isolated twin of motif_tiletrace_4n_k2 (same capsule protocol, same
# binary): the latency numbers quoted next to the motivation figure come from
# HERE, never from the instrumented capture.
platform: perlmutter
nodes: 4
shape: k2
variants: [l01_allgather_dense, l01_slipstream]
families:
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [8, 32]
modes: [isolated]
iters: 10
warmup_iters: 5
skip_correctness: true
timeout_s: 2400
idle_timeout_s: 600
retries: 1
notes: "motif: clean isolated latency twin for the motivation-figure annotation"
