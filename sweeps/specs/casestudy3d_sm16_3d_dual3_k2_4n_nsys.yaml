# CASE-STUDY capture 3 (2026-09-08, figs/case_study, 3D scheduling): the S-C dwell-4
# schedule + plain lcb under nsys AND isolated, one binary (3dsched). Rows: overlapped
# COMET (no-gate c8), gated COMET, OURS 8-slot exchange (RESET-EVERY: the full orbit fires every iteration)
# issued in the host gap (early), sequential (noov), 3D dual (w1 under l0 / w2 under l1). nsys = timelines
# + byte ledgers only, never latency (SCHEMA protocol rule 3); isolated = the latency.
platform: perlmutter
nodes: 4
shape: k2
families:
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32;opool=livecodebench/execution+mmlu/clinical_knowledge+mmlu/college_mathematics+mmlu/electrical_engineering+mmlu/high_school_psychology+mmlu/high_school_world_history+mmlu/philosophy;sched=livecodebench/execution+mmlu/clinical_knowledge+mmlu/college_mathematics+mmlu/electrical_engineering+mmlu/high_school_psychology+mmlu/high_school_world_history+mmlu/philosophy+mmlu/professional_law;dwell=4"
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [64]
modes: [nsys]
iters: 32
sm_margin: 16
warmup_iters: 5
profile_iters: 3
skip_correctness: true
timeout_s: 2400
idle_timeout_s: 900
retries: 1
extra_env:
  FLUX_OURS_NVTX: "1"
  FLUX_A2AV_NVTX_PROXY: "1"
  FLUX_A2AV_EARLY_LAUNCH: "1"
  FLUX_SWEEP_ISOLATED_ITERS: "1"
variants:
  - ablation_l01_s2_swapall_rst_3d_late3_str4_p2p_r2
  - ablation_l01_s2_swapall_rst_3d_dual3_str4_p2p_r2
  - ablation_l01_s2_swapall_rst_3d_dual3_p2p_r2
notes: "case-study 3d-sm16 nsys 9.9 (sm_margin 16): GEMM-mark-gated late3 / dual3 (4 and 1 streams) timeline rows, same binary as capture 3"
