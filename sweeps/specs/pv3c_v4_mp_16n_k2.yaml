# 2026-09-15 pv3c kernel-v4 REFRESH of the 16n main-perf Ours rows at the
# campaign's chosen C = 1/2 (handoff 39 §8 rule) with in-capsule LocCap twins;
# dwire also at C = 1/4 (its C = 1/2 arm dies at NVSHMEM_MALLOC at b16 — the
# aggregator's fill rule). Short walltime for backfill.
platform: perlmutter
nodes: 16
shape: k2
families:
  - "trace:model=Kimi-K2;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [1, 4, 16]
modes: [isolated]
iters: 10
warmup_iters: 5
skip_correctness: true
timeout_s: 900
idle_timeout_s: 300
retries: 1
variants:
  - ours_l01_s1_pv2_r2
  - ours_l01_s1_pv2_r2_pv3c_eps05
  - ours_l01_s2_swap_force_p2p_r2
  - ours_l01_s2_swap_force_p2p_r2_pv3c_eps05
  - ours_l01_s1_pv2_r2_dwire
  - ours_l01_s1_pv2_r2_dwire_pv3c_eps05
  - ours_l01_s1_pv2_r2_dwire_pv3c_eps025
  - llc_l01_s1_pv2
  - llc_l01_s1_pv2_pv3c_eps05
notes: "pv3c kernel v4 refresh, 16n k2 main perf, C=1/2 + LocCap twins (+ dwire C=1/4)"
