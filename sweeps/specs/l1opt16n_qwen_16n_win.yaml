# l1opt16n record spec (2026-08-23, layer1-combine-at-scale campaign): the
# 16n WINNER config for the flux combine arms — n_split_l1=1 (60 -> 15
# blocking puts at nn=16) + 15-lane wire ladders (a2av + dense knobs; knee =
# 15 at nn=16, past-knee flat). Evidence: driver-direct grid on allocation
# 57494434, binary ths_op sha b2bf765a (gen-3). `shape: qwen3` is KEPT (the
# preset does not pin n_split_l1, so the explicit 1 below is legal).
# qwen b64 is a TIE vs the ns4 canon within band (l1 73.1 vs 69.2-72.9) —
# single-config record, tie noted. ns1 beats ns2 at 16n (11.64 vs 13.40 b8,
# 4.57 vs 7.35 b1) — the 8n ns2 verdict does NOT transfer to 16n.
# Reference arms (l01_torch, eplb_l01) are rerun from the ORIGINAL
# datacamp_qwen_16n.yaml (canonical arm configs), same binary.
platform: perlmutter
nodes: 16
shape: qwen3
n_split_l1: 1
families:
  - "trace:model=Qwen3-235B;pools=livecodebench/execution;layer=5;sem=homog;dslots=64:32"
budgets_mib: [1, 2, 4, 8, 16, 32, 64]
modes: [isolated]
iters: 10
warmup_iters: 5
skip_correctness: true
timeout_s: 2400
idle_timeout_s: 900
retries: 1
extra_env:
  FLUX_A2AV_RS_WIRE_STREAMS: "15"
  FLUX_RS_WIRE_STREAMS: "15"
notes: "l1opt16n winner: ns1 + 15-lane wire (both combine wires); Qwen3 16n b1-b64 isolated, s1 canon (dslots 64:32); b64 = tie vs ns4 canon within band"
